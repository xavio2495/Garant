# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: garant
contracts:
  - name: OutcomeSeries
    handler: src/EventHandlers.ts
    events:
      - event: "SeriesCreated(uint256 indexed id, uint8 kind, address resolver, bytes32 oracleRef, int64 strike, int64 lower, uint64 expiry, address protect, address back, string label)"
      - event: "MarketSet(uint256 indexed id, address market)"
      - event: "Minted(uint256 indexed id, address indexed account, uint256 amount)"
      - event: "SetRedeemed(uint256 indexed id, address indexed account, uint256 amount)"
      - event: "Resolved(uint256 indexed id, uint256 payout, int64 observed, uint64 observedAt)"
      - event: "Voided(uint256 indexed id)"
      - event: "Redeemed(uint256 indexed id, address indexed account, uint256 protectIn, uint256 backIn, uint256 ausdOut)"
  - name: CREResolver
    handler: src/EventHandlers.ts
    events:
      - event: "ReportReceived(uint256 indexed id, uint8 outcome, int64 observedA, int64 observedB, uint64 finalizeAfter)"
  - name: CREFxResolver
    handler: src/EventHandlers.ts
    events:
      - event: "FxReportReceived(uint256 indexed id, uint8 outcome, int64 rateA, int64 rateB, uint64 finalizeAfter)"
  - name: KuruMarket
    handler: src/EventHandlers.ts
    events:
      - event: "Trade(uint40 orderId, address maker, bool isBuy, uint256 price, uint96 updatedSize, address taker, address origin, uint96 filledSize)"
chains:
  - id: 10143
    start_block: 69935141
    # HyperSync (needs ENVIO_API_TOKEN) by default; set ENVIO_RPC_FOR=sync to index over RPC only
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: ${ENVIO_RPC_FOR:-fallback}
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: OutcomeSeries
        address: "0xF86CdAeE90DB9901a5F104172294161085070C5A"
      - name: CREResolver
        address: "0xA5dCB9B329b17253FF35202dEb7a2093d06fd7b0"
      - name: CREFxResolver
        address: "0x987bf40239A6641C7B9c4E791d48e5CC5ddEa86c"
      - name: KuruMarket
field_selection:
  transaction_fields:
    - hash

="middle" letter-spacing="0"><tspan x="936.6666666666666" dy="0">K · strike</tspan></text><rect x="990.6666666666662" y="425" width="10" height="10" fill="#eef1f6"/><text x="1007.6666666666662" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef1f6" text-anchor="start" letter-spacing="0"><tspan x="1007.6666666666662" dy="0">spot ≈ ₱62.80</tspan></text><text x="1330" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8f97a8" text-anchor="end" letter-spacing="0"><tspan x="1330" dy="0">p = clamp((K − S) / (K − L), 0, 1)   ·   PROTECT pays p   ·   BACK pays 1 − p   ·   void pays 0.5 each</tspan></text></svg>
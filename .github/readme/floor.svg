</g><text x="85" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#eef1f6" text-anchor="start" letter-spacing="-0.4"><tspan x="85" dy="0">What one PROTECT pays at expiry</tspan></text><text x="85" y="126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8f97a8" text-anchor="start" letter-spacing="0"><tspan x="85" dy="0">USD/PHP floor with strike K = ₱62.50 and full payout at L = ₱60.00. Every PROTECT is backed by 1 AUSD locked up front; BACK takes the rest.</tspan></text><path d="M150 430 H1330" stroke="#fff" stroke-opacity="0.08"/><text x="134" y="435" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8f97a8" text-anchor="end" letter-spacing="0"><tspan x="134" dy="0">$0.00</tspan></text><path d="M150 302.5 H1330" stroke="#fff" stroke-opacity="0.08"/><text x="134" y="307.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8f97a8" text-anchor="end" letter-spacing="0"><tspan x="134" dy="0">$0.50</tspan></text><path d="M150 175 H1330" stroke="#fff" stroke-opacity="0.08"/><text x="134" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8f97a8" text-anchor="end" letter-spacing="0"><tspan x="134" dy="0">$1.00</tspan></text><text x="248.33333333333331" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8f97a8" text-anchor="middle" letter-spacing="0"><tspan x="248.33333333333331" dy="0">₱59</tspan></text><text x="445.0" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef1f6" text-anchor="middle" letter-spacing="0"><tspan x="445.0" dy="0">₱60.00</tspan></text><text x="641.6666666666667" y="458" font-family="ui-monospace